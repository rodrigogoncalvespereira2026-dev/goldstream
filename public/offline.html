<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sonora — sem ligação</title>
    <style>
      body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:28px}
      h1{font-size:22px;margin:0 0 8px}
      p{color:#a7a7a7;font-size:14px;line-height:1.5;margin:0 0 22px}
      button{padding:14px 26px;border:0;border-radius:999px;background:#1ed760;color:#000;font-size:15px;font-weight:800}
    </style>
  </head>
  <body>
    <main>
      <h1>Sem ligação</h1>
      <p>Não consegui falar com o Sonora online.<br />Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.replace(location.origin + location.pathname + '?atualizar=' + Date.now())">
        Tentar de novo
      </button>
    </main>
  </body>
</html>
