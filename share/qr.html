<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goldenstream — instalar no telemóvel</title>
    <style>
      body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
      h1{font-size:24px;margin:0 0 6px}
      p{color:#a7a7a7;font-size:14px;line-height:1.5;margin:0}
      .card{background:#141414;border:1px solid #262626;border-radius:16px;padding:28px;max-width:460px}
      img{width:260px;height:260px;border-radius:12px;background:#fff;padding:10px;margin:18px auto}
      code{display:inline-block;margin-top:6px;padding:8px 14px;border-radius:8px;background:#000;color:#1ed760;font-size:15px}
      ol{text-align:left;color:#c9c9c9;font-size:13.5px;line-height:1.7;margin:18px 0 0;padding-left:22px}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Instalar o goldenstream</h1>
      <p>Aponta a câmara do telemóvel a este código</p>
      <img src="qr.png" alt="QR code para abrir o download no telemóvel" />
      <div><code>http://192.168.1.68:8765</code></div>
      <ol>
        <li>Telemóvel na mesma Wi-Fi do PC</li>
        <li>O Chrome abre a página de download</li>
        <li>Toca em <strong>Baixar goldenstream.apk</strong></li>
        <li>Se o Chrome avisar, escolhe <strong>Transferir mesmo assim</strong></li>
        <li>Instala e abre</li>
      </ol>
    </div>
  </body>
</html>
